name: Deploy Portfolio + Prism Docs

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '*.md'
  workflow_dispatch:
  repository_dispatch:
    types: [ prism-updated ]
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # -------------------------------
      # Checkout portfolio
      # -------------------------------
      - name: Checkout Portfolio Repo
        uses: actions/checkout@v4
        with:
          path: portfolio

      # -------------------------------
      # Setup Ruby (for portfolio)
      # -------------------------------
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Jekyll
        run: gem install jekyll:4.3.2

      - name: Build Portfolio (Jekyll)
        run: jekyll build -s portfolio -d site-dist

      - name: Add SPA Fallback for Portfolio
        run: cp site-dist/index.html site-dist/404.html || true


      # -------------------------------
      # Prism landing page → redirect to subdomain
      # -------------------------------
      - name: Create /prism redirect page
        run: |
          mkdir -p site-dist/prism
          cat > site-dist/prism/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Prism Docs</title>
          <meta http-equiv="refresh" content="0; url=https://prism.mlr.dev/">
          <link rel="canonical" href="https://prism.mlr.dev/">
          <noscript>
            <p>Redirecting to <a href="https://prism.mlr.dev/">Prism Docs</a>…</p>
          </noscript>
          <script>location.replace('https://prism.mlr.dev/');</script>
          HTML

      # -------------------------------
      # Add CNAME + Disable Jekyll
      # -------------------------------
      - name: Add CNAME
        run: |
          if [ -n "${{ vars.PAGES_CNAME }}" ]; then
            echo "${{ vars.PAGES_CNAME }}" > site-dist/CNAME
          fi

      - name: Disable Jekyll
        run: touch site-dist/.nojekyll

      # -------------------------------
      # Upload artifact
      # -------------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
