name: Deploy Portfolio + Prism Docs

on:
  # Run on pushes to either default branch
  push:
    branches: [ master, main ]
    # Build whenever workflow changes or any site files change
    # (remove the old portfolio-only path filter so normal site edits deploy)
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '*.md'
  # Allow manual triggers
  workflow_dispatch:
  # Allow cross-repo triggers from the Prism repo
  repository_dispatch:
    types: [ prism-updated ]
  # Optional: periodic rebuild to pick up remote changes if needed
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # -------------------------------
      # Checkout repos
      # -------------------------------
      - name: Checkout Portfolio Repo
        uses: actions/checkout@v4
        with:
          path: portfolio

      - name: Checkout Prism Repo
        uses: actions/checkout@v4
        with:
          repository: mlr77/prism
          ref: main
          path: prism
          token: ${{ secrets.PRISM_REPO_TOKEN }}

      # -------------------------------
      # Setup Ruby (Jekyll) and Node (for Prism Docs)
      # -------------------------------
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: prism/prism-docs/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      # Quick sanity check of toolchain versions
      - name: Verify toolchain
        run: |
          echo "node: $(node -v)"
          corepack enable || true
          corepack prepare pnpm@10.14.0 --activate || true
          echo "pnpm: $(corepack pnpm -v)" || true
          echo "ruby: $(ruby -v)"
          jekyll -v || true

      # -------------------------------
      # Build Portfolio (Jekyll) → mlr.dev/
      # -------------------------------
      - name: Install Jekyll
        run: |
          gem install jekyll:4.3.2

      - name: Build Portfolio (Jekyll)
        run: |
          jekyll build -s portfolio -d site-dist

      # Quick debug of portfolio artifact contents (non-fatal)
      - name: Debug portfolio artifact root
        run: |
          echo 'Listing site-dist (root):'
          ls -la site-dist | head || true

      # -------------------------------
      # Add SPA Fallback for Portfolio
      # -------------------------------
      - name: Add SPA Fallback
        run: |
          if [ -f site-dist/index.html ]; then
            cp site-dist/index.html site-dist/404.html
          fi

      # -------------------------------
      # Copy OpenAPI JSON for Docs
      # -------------------------------
      - name: Copy OpenAPI for Docs
        run: |
          mkdir -p prism/prism-docs/public
          if [ -f prism/prism-docs/public/openapi.json ]; then rm prism/prism-docs/public/openapi.json; fi
          if [ -f prism/prism/apis/openapi.json ]; then
            cp prism/prism/apis/openapi.json prism/prism-docs/public/openapi.json
          else
            echo '{}' > prism/prism-docs/public/openapi.json
          fi

      # -------------------------------
      # Build Prism Docs → mlr.dev/prism/docs
      # -------------------------------
      - name: Build Prism Docs
        env:
          BASE_URL: /prism/docs
          PUBLIC_BASE_PATH: /prism/docs
          ZUDOKU_PUBLIC_API_URL: /prism/docs/openapi.json
        run: |
          cd prism/prism-docs
          if [ -f package.json ]; then
            corepack enable
            corepack prepare pnpm@10.14.0 --activate
            corepack pnpm install
            corepack pnpm run build
            mkdir -p ../../site-dist/prism/docs
            cp -r dist/* ../../site-dist/prism/docs/
          else
            mkdir -p ../../site-dist/prism/docs
            echo '<!doctype html><title>No Docs</title>' > ../../site-dist/prism/docs/index.html
            cp ../../site-dist/prism/docs/index.html ../../site-dist/prism/docs/404.html
          fi

          # Prism landing page
          mkdir -p ../../site-dist/prism
          cat > ../../site-dist/prism/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Prism</title>
          <h1>Welcome to Prism</h1>
          <p><a href="./docs/">View Documentation</a></p>
          HTML

      # Add SPA fallback inside docs so deep links resolve on Pages
      - name: Add Docs 404 fallback
        run: |
          if [ -f site-dist/prism/docs/index.html ]; then
            cp site-dist/prism/docs/index.html site-dist/prism/docs/404.html
          fi

      # Debug listings to verify docs exist in artifact
      - name: Debug docs output
        run: |
          echo 'Listing built docs dist:'
          ls -la prism/prism-docs/dist | head || true
          echo 'Listing artifact docs path:'
          ls -la site-dist/prism/docs | head || true
          # Quick check for base path reference (non-fatal)
          grep -n "prism/docs" -R prism/prism-docs/dist 2>/dev/null | head || true

      # -------------------------------
      # Add CNAME for custom domain
      # -------------------------------
      - name: Add CNAME
        run: |
          if [ -n "${{ vars.PAGES_CNAME }}" ]; then
            echo "${{ vars.PAGES_CNAME }}" > site-dist/CNAME
          fi

      # Disable Jekyll processing to avoid underscore/asset issues
      - name: Disable Jekyll
        run: |
          touch site-dist/.nojekyll

      # -------------------------------
      # Upload artifact
      # -------------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
