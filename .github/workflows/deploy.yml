name: Deploy Portfolio + Prism Docs

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '*.md'
  workflow_dispatch:
  repository_dispatch:
    types: [ prism-updated ]
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # -------------------------------
      # Checkout portfolio
      # -------------------------------
      - name: Checkout Portfolio Repo
        uses: actions/checkout@v4
        with:
          path: portfolio

      # -------------------------------
      # Checkout only prism-docs folder
      # -------------------------------
      - name: Checkout Prism Docs subdir only
        uses: actions/checkout@v4
        with:
          repository: mlr77/prism
          ref: main
          path: prism
          sparse-checkout: |
            prism-docs
            prism/apis/openapi.json
          sparse-checkout-cone-mode: false
          token: ${{ secrets.PRISM_REPO_TOKEN }}

      # -------------------------------
      # Setup Ruby (for portfolio)
      # -------------------------------
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Jekyll
        run: gem install jekyll:4.3.2

      - name: Build Portfolio (Jekyll)
        run: jekyll build -s portfolio -d site-dist

      - name: Add SPA Fallback for Portfolio
        run: cp site-dist/index.html site-dist/404.html || true

      # -------------------------------
      # Setup Node + pnpm (for prism-docs)
      # -------------------------------
      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      # Ensure OpenAPI spec is placed where the docs expect
      - name: Copy OpenAPI for Docs
        run: |
          mkdir -p prism/prism-docs/public prism/prism-docs/apis
          if [ -f prism/prism/apis/openapi.json ]; then
            cp prism/prism/apis/openapi.json prism/prism-docs/public/openapi.json
            cp prism/prism/apis/openapi.json prism/prism-docs/apis/openapi.json
          else
            echo '{}' > prism/prism-docs/public/openapi.json
            echo '{}' > prism/prism-docs/apis/openapi.json
          fi

      # Seed a fallback file under the basePath so Zudoku's build doesn't error when relocating 404.html
      - name: Seed Docs 404 for Zudoku
        run: |
          mkdir -p prism/prism-docs/public/prism/docs
          if [ ! -f prism/prism-docs/public/prism/docs/404.html ]; then
            printf '%s\n' \
              '<!doctype html>' \
              '<meta charset="utf-8">' \
              '<title>Prism Docs</title>' \
              '<meta http-equiv="refresh" content="0; url=./">' \
              > prism/prism-docs/public/prism/docs/404.html
          fi

      # Also seed a 404 route page so the prerender generates dist/prism/docs/404.html
      - name: Seed Docs 404 Route Page (MDX)
        run: |
          mkdir -p prism/prism-docs/pages
          if [ ! -f prism/prism-docs/pages/404.mdx ]; then
            printf '%s\n' \
              '---' \
              'title: Not Found' \
              '---' \
              '' \
              '# Not Found' \
              '' \
              'This page was not found. Returning to the docs home...' \
              '' \
              '<script>' \
              "if (typeof window !== 'undefined') {" \
              "  const base = '/prism/docs/';" \
              "  const to = new URL('.', window.location.origin + base).pathname;" \
              "  window.location.replace(to);" \
              '}' \
              '</script>' \
              > prism/prism-docs/pages/404.mdx
          fi

      # -------------------------------
      # Build Prism Docs → mlr.dev/prism/docs
      # -------------------------------
      - name: Build Prism Docs
        env:
          BASE_URL: /prism/docs
          PUBLIC_BASE_PATH: /prism/docs
          ZUDOKU_PUBLIC_API_URL: /prism/docs/openapi.json
        run: |
          cd prism/prism-docs
          if [ -f package.json ]; then
            pnpm install
            pnpm run build
            mkdir -p ../../site-dist/prism/docs
            cp -r dist/* ../../site-dist/prism/docs/
          else
            mkdir -p ../../site-dist/prism/docs
            echo '<!doctype html><title>No Docs</title>' > ../../site-dist/prism/docs/index.html
          fi

          # Prism landing page
          mkdir -p ../../site-dist/prism
          cat > ../../site-dist/prism/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Prism</title>
          <h1>Welcome to Prism</h1>
          <p><a href="./docs/">View Documentation</a></p>
          HTML


      - name: Add Docs SPA Fallback
        run: |
          if [ -f site-dist/prism/docs/index.html ]; then
            cp site-dist/prism/docs/index.html site-dist/prism/docs/404.html
          fi

      # -------------------------------
      # Add CNAME + Disable Jekyll
      # -------------------------------
      - name: Add CNAME
        run: |
          if [ -n "${{ vars.PAGES_CNAME }}" ]; then
            echo "${{ vars.PAGES_CNAME }}" > site-dist/CNAME
          fi

      - name: Disable Jekyll
        run: touch site-dist/.nojekyll

      # -------------------------------
      # Upload artifact
      # -------------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
